<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#0B0B0C" />

  <!-- Subtle Outer Ring (Dotted Matrix) -->
  <g fill="#262629">
    <!-- Top & Bottom Arcs -->
    <circle cx="112" cy="40" r="3" />
    <circle cx="128" cy="40" r="3" />
    <circle cx="144" cy="40" r="3" />
    <circle cx="96" cy="44" r="3" />
    <circle cx="160" cy="44" r="3" />
    <circle cx="80" cy="52" r="3" />
    <circle cx="176" cy="52" r="3" />

    <circle cx="112" cy="216" r="3" />
    <circle cx="128" cy="216" r="3" />
    <circle cx="144" cy="216" r="3" />
    <circle cx="96" cy="212" r="3" />
    <circle cx="160" cy="212" r="3" />
    <circle cx="80" cy="204" r="3" />
    <circle cx="176" cy="204" r="3" />

    <!-- Left & Right Arcs -->
    <circle cx="40" cy="112" r="3" />
    <circle cx="40" cy="128" r="3" />
    <circle cx="40" cy="144" r="3" />
    <circle cx="44" cy="96" r="3" />
    <circle cx="44" cy="160" r="3" />
    <circle cx="52" cy="80" r="3" />
    <circle cx="52" cy="176" r="3" />

    <circle cx="216" cy="112" r="3" />
    <circle cx="216" cy="128" r="3" />
    <circle cx="216" cy="144" r="3" />
    <circle cx="212" cy="96" r="3" />
    <circle cx="212" cy="160" r="3" />
    <circle cx="204" cy="80" r="3" />
    <circle cx="204" cy="176" r="3" />
  </g>

  <!-- Main Open-Ring & Play Triangle (Crisp White Dot Matrix on 16px Grid) -->
  <g fill="#FFFFFF">
    <!-- Open Source "C" / Open Ring Silhouette -->
    <!-- Top Section -->
    <circle cx="112" cy="64" r="4.5" />
    <circle cx="128" cy="64" r="4.5" />
    <circle cx="144" cy="64" r="4.5" />
    <circle cx="96" cy="68" r="4.5" />
    <circle cx="160" cy="68" r="4.5" />
    <circle cx="80" cy="80" r="4.5" />
    <circle cx="176" cy="80" r="4.5" />

    <!-- Left Spine -->
    <circle cx="68" cy="96" r="4.5" />
    <circle cx="64" cy="112" r="4.5" />
    <circle cx="64" cy="128" r="4.5" />
    <circle cx="64" cy="144" r="4.5" />
    <circle cx="68" cy="160" r="4.5" />

    <!-- Bottom Section -->
    <circle cx="80" cy="176" r="4.5" />
    <circle cx="176" cy="176" r="4.5" />
    <circle cx="96" cy="188" r="4.5" />
    <circle cx="160" cy="188" r="4.5" />
    <circle cx="112" cy="192" r="4.5" />
    <circle cx="128" cy="192" r="4.5" />
    <circle cx="144" cy="192" r="4.5" />

    <!-- Center Play Triangle (Dot Matrix) -->
    <!-- Column 1 (Base) -->
    <circle cx="104" cy="96" r="4.5" />
    <circle cx="104" cy="112" r="4.5" />
    <circle cx="104" cy="128" r="4.5" />
    <circle cx="104" cy="144" r="4.5" />
    <circle cx="104" cy="160" r="4.5" />

    <!-- Column 2 -->
    <circle cx="120" cy="104" r="4.5" />
    <circle cx="120" cy="120" r="4.5" />
    <circle cx="120" cy="136" r="4.5" />
    <circle cx="120" cy="152" r="4.5" />

    <!-- Column 3 -->
    <circle cx="136" cy="112" r="4.5" />
    <circle cx="136" cy="128" r="4.5" />
    <circle cx="136" cy="144" r="4.5" />

    <!-- Column 4 -->
    <circle cx="152" cy="120" r="4.5" />
    <circle cx="152" cy="136" r="4.5" />

    <!-- Column 5 (Tip) -->
    <circle cx="168" cy="128" r="4.5" />
  </g>

  <!-- Equalizer / Audio Pulse Dots in the Open Gap (Mid-Grey Accent) -->
  <g fill="#7A7A82">
    <circle cx="192" cy="112" r="3.5" />
    <circle cx="192" cy="128" r="3.5" />
    <circle cx="192" cy="144" r="3.5" />
    <circle cx="206" cy="120" r="3" />
    <circle cx="206" cy="136" r="3" />
  </g>
</svg>